services:

  inventory-db:
    container_name: inventory-db
    image: postgres:14-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=${INVENTORY_DB_USER}
      - POSTGRES_PASSWORD=${INVENTORY_DB_PASSWORD}
      - POSTGRES_DB=${INVENTORY_DB_NAME}
    volumes:
      - inventory-db-volume:/var/lib/postgresql/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movieuser -d movies_db"]
      interval: 3s
      timeout: 1s
      retries: 5

  inventory-app: 
    container_name: inventory-app
    build: 
      context: inventory-app
    restart: on-failure
    env_file: .env
    environment:
      - INVENTORY_DB_URI=${INVENTORY_DB_URI}
    networks:
      - microservices-network
    depends_on:
      inventory-db:
        condition: service_healthy

  api-gateway:
    container_name: api-gateway-app
    build:
      context: api-gateway
    restart: on-failure
    env_file: .env
    ports:
      - "3000:3000"  
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - INVENTORY_API_URL=${INVENTORY_API_URL}
    volumes:
      - api-gateway-volume:/var/lib/postgresql/data
    networks:
      - microservices-network
    depends_on:
      - inventory-app
      - billing-app
      - rabbit-queue

  billing-db:
    container_name: billing-db
    image: postgres:14-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=${BILLING_DB_USER}
      - POSTGRES_PASSWORD=${BILLING_DB_PASSWORD}
      - POSTGRES_DB=${BILLING_DB_NAME}
      # - BILLING_DB_HOST=${BILLING_DB_HOST}
    volumes:
      - billing-db-volume:/var/lib/postgresql/data  
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billinguser -d billing_db"]
      interval: 3s
      timeout: 1s
      retries: 5

  billing-app:
    build: 
      context: billing-app
    restart: on-failure
    container_name: billing-app
    environment:
      - BILLING_DB_URI=${BILLING_DB_URI}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE}
    networks:
      - microservices-network
    depends_on:
      billing-db:
        condition: service_healthy
      rabbit-queue:
        condition: service_healthy

  rabbit-queue:
    image: rabbitmq:3-management  
    container_name: rabbit-queue
    restart: on-failure
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    networks:
    - microservices-network
    ports:
      - "5672:5672" 
      - "15672:15672"
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq
    command: >
      bash -c "
      rabbitmq-plugins enable rabbitmq_management &&
      rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  microservices-network:
    driver: bridge

volumes:
  inventory-db-volume:
  billing-db-volume:
  api-gateway-volume: